[project]
name = "api-csv-bulk-import"
version = "1.0.0"
description = "REST API for bulk import/export of relational data with strict validation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Fisherk2", email = "fisherk2@example.com"}
]
keywords = ["fastapi", "csv", "bulk-import", "ddd", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic[email]>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "tenacity>=8.3.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-passlib>=1.7.0",
    "types-python-jose>=3.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["migrations/versions/", ".venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations/versions/", ".venv/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
python_files = "test_*.py"
addopts = "--verbose --cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
