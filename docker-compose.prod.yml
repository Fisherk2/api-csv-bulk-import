# ── Docker Compose — Production Overrides ────────────────
# Extends docker-compose.yml for production deployment.
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml down

services:
  api:
    # Production mode — no debug, no hot-reload, no source mount
    environment:
      - DEBUG=false
    # Use multiple workers and disable access logging (handled by Nginx)
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    # Remove source code mount (no hot-reload in production)
    volumes: []
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  db:
    # Production credentials — must be set via environment or .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: api-csv-import-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped
    networks:
      - backend
