[alembic]
# Path to migration scripts (relative to project root)
script_location = migrations

# Logging configuration
# loggers = keys('root,sqlalchemy,alembic')
# [loggers]
# ... (use default Python logging)

# Template used to generate migration file names
# Uses date/time to ensure chronological ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepending file names with revision ID
# prepend_sys_path = .

# Timezone for migration timestamps
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Version locations
# version_locations =

# Black format for migration scripts
# hooks = black

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
