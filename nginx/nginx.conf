# ── Nginx Reverse Proxy — Production ─────────────────────
# Proxies requests to the FastAPI application running on port 8000.
# Adds security headers and enforces body size limits at the edge.
#
# TLS/HTTPS Setup:
#   1. Generate self-signed cert for testing:
#      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout /etc/nginx/ssl/selfsigned.key \
#        -out /etc/nginx/ssl/selfsigned.crt
#
#   2. For production, use Let's Encrypt:
#      certbot --nginx -d api.example.com
#
#   3. Uncomment the SSL block below and comment out the HTTP-only block.

# ── HTTP → HTTPS Redirect ────────────────────────────────
# Uncomment this block when TLS certificates are available:
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ── HTTP Only (Development / No TLS) ─────────────────────
# Remove this block once TLS is configured.
server {
    listen 80;
    server_name localhost;

    # ── Body Size ────────────────────────────────────────
    # Must match MAX_FILE_SIZE_MB from the API settings.
    client_max_body_size 10m;

    # ── Security Headers ─────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Proxy Configuration ──────────────────────────────
    location / {
        proxy_pass http://api:8000;

        # Forward original host, IP, and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Health Check Path ────────────────────────────────
    # Proxies to the API health endpoint so Docker can detect
    # backend failures (not just nginx being alive).
    location /health {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}

