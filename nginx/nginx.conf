# ── Nginx Reverse Proxy — Production ─────────────────────
# Proxies requests to the FastAPI application running on port 8000.
# Adds security headers and enforces body size limits at the edge.

server {
    listen 80;
    server_name localhost;

    # ── Body Size ────────────────────────────────────────
    # Must match MAX_FILE_SIZE_MB from the API settings.
    client_max_body_size 10m;

    # ── Security Headers ─────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Proxy Configuration ──────────────────────────────
    location / {
        proxy_pass http://api:8000;

        # Forward original host, IP, and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Health Check Path ────────────────────────────────
    # Proxies to the API health endpoint so Docker can detect
    # backend failures (not just nginx being alive).
    location /health {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}
